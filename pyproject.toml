[project]
name = "cloud-sec-dashboard"
version = "0.1.0"
description = "Cloud security dashboard — a production-style DevSecOps learning project"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "zacharyliu" }]

# Application dependencies land in later phases. Phase 0 is tooling only.
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.146.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
